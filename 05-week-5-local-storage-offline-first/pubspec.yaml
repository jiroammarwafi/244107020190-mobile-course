name: week5_offline_notes
description: "A Flutter offline-first notes app with SQLite, SharedPreferences, and Riverpod."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2
  path: ^1.9.1
  go_router: ^18.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
